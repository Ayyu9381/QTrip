<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QTrip Adventures</title>

    <link rel="stylesheet" href="../../css/styles.css" />

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
        crossorigin="anonymous"
    >
</head>

<body>

    <!-- Navigation bar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light ps-3">

        <a class="navbar-brand" href="../../">
            QTrip
        </a>

        <div id="city-name"></div>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNavDropdown"
            aria-controls="navbarNavDropdown"
            aria-expanded="false"
            aria-label="Toggle navigation"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNavDropdown">

            <ul class="navbar-nav d-flex justify-content-end w-100">

                <li class="nav-item active">
                    <a class="nav-link" href="../../">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="./reservations/">
                        Reservations
                    </a>
                </li>

            </ul>

        </div>
    </nav>


    <!-- Content section -->
    <div class="container">

        <div class="content">

            <!-- Page heading and description -->

            <h1>
                Explore all adventures
            </h1>

            <p style="font-size: 24px">
                Here's a list of places that you can explore in city
            </p>


            <div class="mb-5">

                <!-- Filters section -->

                <div class="filter-bar d-flex align-items-center">

                    <div class="filter-bar-tile">
                        <label for="duration">
                            Filters:
                        </label>
                    </div>


                    <!-- Duration filter -->

                    <div class="filter-bar-tile d-flex align-items-center">

                        <select
                            class="form-control"
                            name="duration"
                            id="duration-select"
                            onchange="selectDuration(event)"
                        >

                            <option disabled selected value="">
                                Filter by Duration (Hours)
                            </option>

                            <option value="0-2">
                                0-2 Hours
                            </option>

                            <option value="2-6">
                                2-6 Hours
                            </option>

                            <option value="6-12">
                                6-12 Hours
                            </option>

                            <option value="12-99">
                                12+ Hours
                            </option>

                        </select>


                        <div
                            class="ms-3"
                            style="color: #0645ad; cursor: pointer"
                            onclick="clearDuration(event)"
                        >
                            Clear
                        </div>

                    </div>


                    <!-- Category filter -->

                    <div class="filter-bar-tile d-flex align-items-center">

                        <select
                            class="form-control"
                            id="category-select"
                            onchange="selectCategory(event)"
                        >

                            <option disabled selected value="">
                                Add Category
                            </option>

                            <option value="Cycling">
                                Cycling Routes
                            </option>

                            <option value="Hillside">
                                Hillside Getaways
                            </option>

                            <option value="Beaches">
                                Serene Beaches
                            </option>

                            <option value="Party">
                                Party Spots
                            </option>

                        </select>


                        <div
                            class="ms-3"
                            style="color: #0645ad; cursor: pointer"
                            onclick="clearCategory(event)"
                        >
                            Clear
                        </div>

                    </div>

                </div>


                <!-- Section to display selected categories -->

                <div class="mt-2" id="category-section">

                    <div
                        class="d-flex align-items-center"
                        id="category-list"
                    >
                    </div>

                </div>

            </div>


            <!-- Display Adventures cards -->

            <div class="row" id="data"></div>

        </div>

    </div>


    <!-- Footer -->

    <footer>

        <div class="container">
            © QTrip 2020
        </div>

    </footer>


    <!-- Bootstrap script -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"
    ></script>


    <script type="module">

        import {
            getCityFromURL,
            fetchAdventures,
            addAdventureToDOM,
            filterByDuration,
            filterByCategory,
            filterFunction,
            saveFiltersToLocalStorage,
            getFiltersFromLocalStorage,
            generateFilterPillsAndUpdateDOM
        } from "../../modules/adventures_page.js";


        // Declaring global variable adventures
        let adventures;


        /*
         * Checks if filters are available in local storage
         * and sets the value accordingly.
         *
         * Structure:
         *
         * {
         *     duration: "6-10",
         *     category: []
         * }
         *
         * Duration is a single-value filter.
         * Category is a multi-value filter.
         */

        let filters =
            getFiltersFromLocalStorage() !== null
                ? getFiltersFromLocalStorage()
                : {
                    duration: "",
                    category: []
                };


        // Entry point - executed when DOM is loaded

        (async function () {

            // Get city from URL query parameter

            let city = await getCityFromURL(
                window.location.search
            );


            // Fetch adventures for the city

            adventures = await fetchAdventures(city);


            // Apply filters

            let filteredAdventures = filterFunction(
                adventures,
                filters
            );


            // Add filtered adventures to DOM

            addAdventureToDOM(
                filteredAdventures
            );


            // Display filter pills

            generateFilterPillsAndUpdateDOM(
                filters
            );

        })();


        // Executed when duration dropdown changes


function selectDuration(event) {
    filters.duration = event.target.value;
    document.getElementById("data").textContent = "";
    let filteredAdventures = filterFunction(adventures, filters);
    addAdventureToDOM(filteredAdventures);
    saveFiltersToLocalStorage(filters);
}

function clearDuration(event) {
    // Reset duration filter
    filters.duration = "";

    // Reset dropdown to default option
    document.getElementById("duration-select").selectedIndex = 0;

    // Clear existing adventure cards
    document.getElementById("data").textContent = "";

    // Apply remaining filters, if any
    let filteredAdventures = filterFunction(adventures, filters);

    // Update the page
    addAdventureToDOM(filteredAdventures);

    // Save updated filters to localStorage
    saveFiltersToLocalStorage(filters);
}


        // Executed when category dropdown changes

        function selectCategory(event) {

            // Clear existing adventure cards

            document.getElementById("data").textContent = "";


            // Clear existing category pills

            document.getElementById("category-list").textContent = "";


            // Get selected category

            let category = event.target.value;


            // Reset category dropdown

            document.getElementById(
                "category-select"
            ).selectedIndex = 0;


            // Add selected category

            filters["category"].push(category);


            // Remove duplicate categories

            filters["category"] =
                filters["category"].filter(onlyUnique);


            // Update category pills

            generateFilterPillsAndUpdateDOM(
                filters
            );


            // Filter adventures

            let filteredAdventures = filterFunction(
                adventures,
                filters
            );


            // Display filtered adventures

            addAdventureToDOM(
                filteredAdventures
            );


            // Save filters to localStorage

            saveFiltersToLocalStorage(
                filters
            );
        }


        // Executed when category Clear is clicked

        function clearCategory(event) {

            // Clear adventure cards

            document.getElementById("data").textContent = "";


            // Clear category pills

            document.getElementById(
                "category-list"
            ).textContent = "";


            // Clear category filters

            filters["category"] = [];


            // Apply remaining filters

            let filteredAdventures = filterFunction(
                adventures,
                filters
            );


            // Display adventures

            addAdventureToDOM(
                filteredAdventures
            );


            // Save updated filters

            saveFiltersToLocalStorage(
                filters
            );
        }


        // Helper function
        // Removes duplicate values from an array

        function onlyUnique(value, index, self) {

            return self.indexOf(value) === index;

        }


        // Register module-based functions
        // so inline HTML events can access them

        window.selectDuration = selectDuration;

        window.selectCategory = selectCategory;

        window.clearDuration = clearDuration;

        window.clearCategory = clearCategory;

    </script>

</body>

</html>
